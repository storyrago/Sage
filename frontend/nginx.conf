# 액세스 로그에 추적 ID($request_id, nginx 1.11.0+ 내장 변수)를 남긴다.
# 이게 없으면 nginx 로그와 앱 로그(RequestIdFilter가 심는 MDC requestId)를 이어붙일 수 없다.
log_format with_request_id '$remote_addr - [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" rid=$request_id';
access_log /var/log/nginx/access.log with_request_id;

# HTTP → HTTPS 리다이렉트 (평문 접속은 전부 https로)
server {
  listen 80;
  server_name sagertc.duckdns.org;
  return 301 https://sagertc.duckdns.org$request_uri;
}

# HTTPS
server {
  listen 443 ssl;
  server_name sagertc.duckdns.org;
  client_max_body_size 10m;

  # Let's Encrypt 인증서 (호스트 /etc/letsencrypt 를 볼륨 마운트)
  ssl_certificate     /etc/letsencrypt/live/sagertc.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sagertc.duckdns.org/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  root /usr/share/nginx/html;
  index index.html;

  # 해시 파일명 정적 자산(JS/CSS): 내용 바뀌면 파일명도 바뀌므로 영구 캐시
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 화면(정적 파일): 파일 있으면 그거, 없으면 index.html (SPA 폴백)
  # index.html은 항상 재검증 → 새 배포 즉시 반영(캐시 stale 방지)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # 관리 엔드포인트는 외부에 열지 않는다.
  # 프록시 규칙이 없으면 SPA 폴백이 걸려 200 HTML이 나가고, 앱이 죽어도 살아있는 것처럼 보인다.
  location /actuator/ {
    return 404;
  }
  location = /actuator {
    return 404;
  }

  # REST → Spring (app 컨테이너 8080)
  location /api/ {
    proxy_pass http://app:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;   # https → Spring이 TLS 뒤임을 인지
    proxy_set_header X-Request-Id $request_id;    # nginx 액세스 로그와 앱 로그를 같은 추적 ID로 이어붙인다
  }

  # OAuth2 진입·콜백 → Spring (app 컨테이너 8080)
  location /oauth2/ {
    proxy_pass http://app:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }
  location /login/oauth2/ {
    proxy_pass http://app:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  # WebSocket(STOMP /ws) → Spring. HTTPS라서 브라우저는 wss:// 로 접속됨
  location /ws {
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
