# HTTP → HTTPS 리다이렉트 (평문 접속은 전부 https로)
server {
  listen 80;
  server_name sagertc.duckdns.org;
  return 301 https://sagertc.duckdns.org$request_uri;
}

# HTTPS
server {
  listen 443 ssl;
  server_name sagertc.duckdns.org;
  client_max_body_size 10m;

  # Let's Encrypt 인증서 (호스트 /etc/letsencrypt 를 볼륨 마운트)
  ssl_certificate     /etc/letsencrypt/live/sagertc.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sagertc.duckdns.org/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  root /usr/share/nginx/html;
  index index.html;

  # 해시 파일명 정적 자산(JS/CSS): 내용 바뀌면 파일명도 바뀌므로 영구 캐시
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 화면(정적 파일): 파일 있으면 그거, 없으면 index.html (SPA 폴백)
  # index.html은 항상 재검증 → 새 배포 즉시 반영(캐시 stale 방지)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # REST → Spring (app 컨테이너 8080)
  location /api/ {
    proxy_pass http://app:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;   # https → Spring이 TLS 뒤임을 인지
  }

  # WebSocket(STOMP /ws) → Spring. HTTPS라서 브라우저는 wss:// 로 접속됨
  location /ws {
    proxy_pass http://app:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
