# 로컬 개발용 관측 스택(Prometheus + Grafana). 운영 배포(CD)는 docker-compose.yml만 읽으므로
# 이 파일은 운영에 영향을 주지 않는다.
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"   # 로컬 디스크가 무한정 커지지 않게 보관 기간을 둔다
    extra_hosts:
      # 앱은 컨테이너 밖 호스트에서 ./gradlew bootRun으로 뜬다. 맥은 host.docker.internal을 기본
      # 지원하지만 리눅스는 이 매핑이 있어야 컨테이너에서 호스트로 닿는다.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.0
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
