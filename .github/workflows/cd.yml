name: CD

on:
  push:
    branches: [ develop ]      # develop에 머지되면 자동 배포

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}       # ← 시크릿 참조
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}      # ← .pem 내용 시크릿
          command_timeout: 20m
          script: |
            cd ~/realtimechat-backend
            git fetch origin
            git checkout develop
            git reset --hard origin/develop     # 서버를 origin/develop에 강제 맞춤
            chmod +x gradlew
            ./gradlew --stop                              # 기존 gradle 데몬 종료 (메모리 확보)
            ./gradlew build -x test --no-daemon           # 데몬 없이 빌드 (끝나면 메모리 즉시 해제)
            docker compose up -d --build --remove-orphans # 재빌드·재시작 + 옛 컨테이너 정리