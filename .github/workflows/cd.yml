name: CD

on:
  push:
    branches: [ develop ]      # develop에 머지되면 자동 배포

# 같은 브랜치의 CD는 한 번에 하나만 돌린다.
# 두 실행이 겹치면 각자 :latest 태그에 push하고 같은 컨테이너를 동시에 교체하려 해서,
# 늦게 끝난 쪽(= 더 오래된 커밋일 수 있음)의 이미지가 배포되고 컨테이너 교체가 실패한다.
# 새 실행이 뜨면 진행 중인 오래된 실행을 취소해 항상 최신 커밋이 배포되게 한다.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_APP: ghcr.io/storyrago/realtimechat-backend-app
  IMAGE_WEB: ghcr.io/storyrago/realtimechat-backend-web

jobs:
  # 1) GitHub Actions(메모리 넉넉)에서 이미지 빌드 → GHCR push. EC2에서 빌드 안 함.
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # GHCR push 권한 (GITHUB_TOKEN 사용, 별도 시크릿 불필요)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew build -x test        # 테스트는 CI(ci.yml)에서 이미 검증됨

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push app image        # 컨텍스트 . (Dockerfile이 build/libs/*.jar 복사)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:latest
            ${{ env.IMAGE_APP }}:${{ github.sha }}

      - name: Build & push web image        # 컨텍스트 ./frontend (node 빌드 → nginx)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}

  # 2) EC2는 빌드 없이 pull만 → 순식간. 1GB 서버 OOM/타임아웃 원천 제거.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          envs: DEPLOY_SHA                          # 러너의 DEPLOY_SHA를 원격 셸로 전달
          script: |
            set -e                                  # 한 명령이라도 실패하면 즉시 중단 → 잡 실패로 표면화
            cd ~/realtimechat-backend
            git fetch origin

            # 배포 대상이 develop 끝이 아니면 배포하지 않는다.
            # 큐 대기·재실행으로 완료 순서가 뒤집혀도 옛 커밋이 배포되지 못한다.
            TIP=$(git rev-parse origin/develop)
            if [ "$TIP" != "$DEPLOY_SHA" ]; then
              echo "배포 중단: 이 실행의 커밋 $DEPLOY_SHA 는 develop 최신 $TIP 이 아니다."
              exit 1
            fi

            git reset --hard "$DEPLOY_SHA"          # compose 파일도 배포 대상 커밋에서 가져온다
            export IMAGE_TAG="$DEPLOY_SHA"          # 이 실행이 빌드한 이미지만 받는다

            # 배포된 태그를 호스트에 남긴다 — 사람이 친 docker compose 명령도 같은 이미지를 쓴다.
            # 시크릿 파일이므로 임시 파일에 쓰고 권한을 맞춘 뒤 원자 교체한다.
            rc=0
            grep -v '^IMAGE_TAG=' .env > .env.tmp || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo ".env 갱신 실패: grep 종료 코드 $rc"
              rm -f .env.tmp
              exit 1
            fi
            echo "IMAGE_TAG=$DEPLOY_SHA" >> .env.tmp
            chmod 600 .env.tmp
            mv .env.tmp .env

            docker compose pull                     # 해당 SHA 태그만 받기 (실패 시 여기서 중단, 기존 컨테이너 유지)
            docker compose up -d --remove-orphans   # 빌드 없이 새 이미지로 교체

            # SHA 태그를 쓰면 옛 이미지가 태그를 계속 들고 있어 dangling이 되지 않는다.
            # 사용 중 이미지는 -a여도 보호된다.
            docker image prune -af --filter "until=72h" || echo "이미지 정리 실패 — 배포 검증은 계속한다"

            # app·web이 healthy 될 때까지 대기 (서비스당 5초 간격 35회 = 최대 175초)
            for SVC in app web; do
              CID=$(docker compose ps -q "$SVC")
              if [ -z "$CID" ]; then
                echo "기동 실패: $SVC 컨테이너가 없다"
                docker compose logs --tail=50 "$SVC"
                exit 1
              fi
              STATUS=""
              for i in $(seq 1 35); do
                STATUS=$(docker inspect -f '{{.State.Health.Status}}' "$CID" 2>&1) || STATUS="inspect_failed"
                if [ "$STATUS" = healthy ]; then break; fi
                if [ "$STATUS" = unhealthy ]; then
                  echo "기동 실패: $SVC 컨테이너가 unhealthy"
                  docker compose logs --tail=50 "$SVC"
                  exit 1
                fi
                sleep 5
              done
              if [ "$STATUS" != healthy ]; then
                echo "기동 검증 타임아웃: $SVC 상태=$STATUS"
                docker compose logs --tail=50 "$SVC"
                exit 1
              fi
            done

      - name: Smoke test (공개 URL)
        run: |
          set -e
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors https://sagertc.duckdns.org/)
          [ "$code" = 200 ] || { echo "루트 응답 $code"; exit 1; }
          api=$(curl -sS -o /dev/null -w '%{http_code}' https://sagertc.duckdns.org/api/chatrooms)
          # 미인증 API 호출: /api/**는 401 엔트리포인트가 응답한다.
          [ "$api" = 401 ] || { echo "API 응답 $api"; exit 1; }
          actuator=$(curl -sS -o /dev/null -w '%{http_code}' https://sagertc.duckdns.org/actuator/health)
          [ "$actuator" = 404 ] || { echo "actuator 응답 $actuator"; exit 1; }
          echo "스모크 통과: / =$code, /api/chatrooms=$api, /actuator/health=$actuator"
