name: CI

# PR이 열린 브랜치에 push하면 push·pull_request 실행이 각각 생겨 같은 커밋을 두 번 빌드한다.
# push는 머지 결과를 받는 브랜치로 한정하고, feature 브랜치는 PR 컨텍스트에서만 검증한다.
on:
  push:
    branches: [ develop, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:                # ← compose의 services 와 똑같은 개념
      redis:
        image: redis:7
        ports:
          - 6379:6379        # 러너의 localhost:6379 로 연결

      mysql:
        image: mysql:8.0
        env:                 # compose의 environment 와 동일
          MYSQL_ROOT_PASSWORD: 1111
          MYSQL_DATABASE: spring_realtimechat_service
        ports:
          - 3306:3306
        options: >-          # compose의 healthcheck 와 동일 (준비될 때까지 대기)
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p1111"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4          # ① 코드 받기 (git clone)

      - uses: actions/setup-java@v4        # ② 자바 준비 (JDK 17)
        with:
          distribution: temurin
          java-version: '17'

      - name: Build & Test                 # ③ 빌드 + 테스트 (이제 -x test 없이!)
        run: |
          chmod +x gradlew
          ./gradlew build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (tsc)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # nginx 설정이 깨지면 web 컨테이너가 기동에 실패한다. 배포 중에 발견하면 이미 늦다.
      # nginx -t는 문법 외에 upstream 호스트 이름과 인증서 파일 존재까지 확인한다.
      # 격리된 컨테이너에는 compose 네트워크의 app도 Let's Encrypt 인증서도 없으므로,
      # 문법만 검사되도록 이름 해석과 더미 인증서를 최소한으로 대준다.
      - name: nginx 설정 문법 검사
        run: |
          CERT_DIR=/tmp/nginx-check/live/sagertc.duckdns.org
          mkdir -p "$CERT_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$CERT_DIR/privkey.pem" -out "$CERT_DIR/fullchain.pem" \
            -subj "/CN=localhost" 2>/dev/null
          docker run --rm \
            --add-host app:127.0.0.1 \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "/tmp/nginx-check:/etc/letsencrypt:ro" \
            nginx:1.27-alpine nginx -t