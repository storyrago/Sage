name: CDC

# cdcTest는 컨테이너 4종(MySQL·Kafka·스키마 레지스트리·Debezium Connect)을 띄워 무겁다.
# 모든 PR이 아니라 outbox → Debezium → Kafka 경로에 닿는 변경에서만 돌리고, 그 밖에는 수동으로 실행한다.
# develop push는 같은 변경을 PR에서 이미 돌렸으므로 넣지 않는다.
on:
  pull_request:
    paths:
      - 'backend/src/main/java/com/example/springboot_realtimechat/domain/message/**'
      - 'backend/src/main/java/com/example/springboot_realtimechat/domain/image/event/**'
      - 'backend/src/main/java/com/example/springboot_realtimechat/global/outbox/**'
      - 'backend/src/main/java/com/example/springboot_realtimechat/global/kafka/**'
      - 'backend/src/main/resources/avro/**'
      - 'backend/src/main/resources/db/migration/**'
      - 'backend/src/main/resources/application*.yaml'
      - 'backend/src/test/java/com/example/springboot_realtimechat/outbox/**'
      - 'backend/src/test/java/com/example/springboot_realtimechat/delivery/**'
      - 'backend/src/test/resources/**'
      - 'backend/build.gradle'
      - 'backend/gradle/**'
      - 'infra/local/connect/**'
      - 'infra/local/mysql/**'
      - 'infra/local/scripts/**'
      - 'infra/local/docker-compose.yml'
      - '.github/workflows/cdc.yml'
  workflow_dispatch:

# 같은 PR에 새 커밋이 올라오면 이전 실행은 의미가 없다.
concurrency:
  group: cdc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cdc-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 테스트가 띄우는 앱은 입력 중 표시·접속 상태용 Redis 리스너를 기동 시 연결한다. 나머지 컨테이너는 Testcontainers가 띄운다.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: cdcTest
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew cdcTest

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cdc-test-report
          path: backend/build/reports/tests/cdcTest
