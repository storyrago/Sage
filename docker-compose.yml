services:
  app:
    image: ghcr.io/storyrago/sage-app:${IMAGE_TAG:?IMAGE_TAG required}
    build: ./backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: prod                   # 기본값이 local이라 명시하지 않으면 운영이 개발 프로파일로 뜬다
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}         # OAuth: Google 클라이언트 자격증명 (값은 .env)
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}           # OAuth: Kakao REST API 키 (값은 .env)
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}                 # OAuth 성공 후 JWT 핸드오프 대상 프론트 주소
      JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:-3600000}
    healthcheck:                                    # 배포 스크립트가 이 상태로 기동 성공을 판정한다 (readiness: db·diskSpace 확인, Redis는 fail-open이라 게이트에서 제외)
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      - redis
    logging:
      # 로컬 파일 로깅. 로테이션을 걸지 않으면 로그가 무한히 쌓여 디스크를 채운다.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/storyrago/sage-web:${IMAGE_TAG:?IMAGE_TAG required}
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro   # 인증서를 컨테이너에 읽기전용 마운트
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    depends_on:
      - app
    logging:
      # 로컬 파일 로깅. 로테이션을 걸지 않으면 로그가 무한히 쌓여 디스크를 채운다.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7
    restart: unless-stopped
    # 거부목록은 재연결로 복구되지 않는다. 컨테이너가 재생성돼도 살아남아야 한다.
    # maxmemory-policy는 기본값(noeviction)을 유지한다 — allkeys-lru로 바꾸면 거부목록 키가 조용히 evict된다.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    logging:
      # 로컬 파일 로깅. 로테이션을 걸지 않으면 로그가 무한히 쌓여 디스크를 채운다.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
