services:
  app:
    image: ghcr.io/storyrago/realtimechat-backend-app:${IMAGE_TAG:?IMAGE_TAG required}
    build: ./backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: prod                   # 기본값이 local이라 명시하지 않으면 운영이 개발 프로파일로 뜬다
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}         # OAuth: Google 클라이언트 자격증명 (값은 .env)
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}           # OAuth: Kakao REST API 키 (값은 .env)
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}                 # OAuth 성공 후 JWT 핸드오프 대상 프론트 주소
      JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:-3600000}
      # 메트릭 내보내기 스위치. compose environment는 명시 목록이라 여기 없으면 .env에 넣어도 컨테이너에 닿지 않는다.
      # 기본값은 application.yaml과 같게 둔다 — .env에 값이 없어도 지금 동작이 그대로 유지된다.
      OTLP_METRICS_ENABLED: ${OTLP_METRICS_ENABLED:-false}
      OTLP_METRICS_URL: ${OTLP_METRICS_URL:-}
      OTLP_METRICS_AUTH: ${OTLP_METRICS_AUTH:-}
      OTLP_METRICS_ENV: ${OTLP_METRICS_ENV:-prod}
    healthcheck:                                    # 배포 스크립트가 이 상태로 기동 성공을 판정한다 (readiness: db·diskSpace 확인, Redis는 fail-open이라 게이트에서 제외)
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    depends_on:
      - redis
    logging:
      # 로그를 CloudWatch로 보낸다. 컨테이너가 재생성되면 로컬 로그는 사라지므로,
      # 장애 원인을 나중에 찾으려면 밖에 남아 있어야 한다.
      # 자격증명은 컨테이너가 아니라 Docker 데몬이 EC2 인스턴스 역할에서 가져온다.
      # 로그 그룹은 콘솔에서 보존 기간과 함께 미리 만들어 둔다 — 없으면 컨테이너가 뜨지 않고 배포가 실패한다(의도).
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /sage/app
        # 스택트레이스가 줄마다 별개 이벤트로 쪼개지지 않게, 시각으로 시작하는 줄만 새 이벤트로 본다.
        awslogs-multiline-pattern: '^\d{4}-\d{2}-\d{2}'
        # 이중 로깅(Docker 20.10+) 로컬 캐시. docker compose logs를 계속 쓰면서 디스크는 묶어둔다.
        cache-max-size: "10m"
        cache-max-file: "3"

  web:
    image: ghcr.io/storyrago/realtimechat-backend-web:${IMAGE_TAG:?IMAGE_TAG required}
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro   # 인증서를 컨테이너에 읽기전용 마운트
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    depends_on:
      - app
    logging:
      # 로그를 CloudWatch로 보낸다. 컨테이너가 재생성되면 로컬 로그는 사라지므로,
      # 장애 원인을 나중에 찾으려면 밖에 남아 있어야 한다.
      # 자격증명은 컨테이너가 아니라 Docker 데몬이 EC2 인스턴스 역할에서 가져온다.
      # 로그 그룹은 콘솔에서 보존 기간과 함께 미리 만들어 둔다 — 없으면 컨테이너가 뜨지 않고 배포가 실패한다(의도).
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /sage/web
        # 이중 로깅(Docker 20.10+) 로컬 캐시. docker compose logs를 계속 쓰면서 디스크는 묶어둔다.
        cache-max-size: "10m"
        cache-max-file: "3"

  redis:
    image: redis:7
    restart: unless-stopped
    # 거부목록은 재연결로 복구되지 않는다. 컨테이너가 재생성돼도 살아남아야 한다.
    # maxmemory-policy는 기본값(noeviction)을 유지한다 — allkeys-lru로 바꾸면 거부목록 키가 조용히 evict된다.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    logging:
      # 로그를 CloudWatch로 보낸다. 컨테이너가 재생성되면 로컬 로그는 사라지므로,
      # 장애 원인을 나중에 찾으려면 밖에 남아 있어야 한다.
      # 자격증명은 컨테이너가 아니라 Docker 데몬이 EC2 인스턴스 역할에서 가져온다.
      # 로그 그룹은 콘솔에서 보존 기간과 함께 미리 만들어 둔다 — 없으면 컨테이너가 뜨지 않고 배포가 실패한다(의도).
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /sage/redis
        # 이중 로깅(Docker 20.10+) 로컬 캐시. docker compose logs를 계속 쓰면서 디스크는 묶어둔다.
        cache-max-size: "10m"
        cache-max-file: "3"

volumes:
  redis-data:
