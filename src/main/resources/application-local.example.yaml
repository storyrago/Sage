spring:
  datasource:
    url: jdbc:mysql://localhost:3306/spring_realtimechat_service
    username: your_username
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update   # 로컬은 스키마 자동 생성/변경 (운영 base는 validate)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: your-google-client-id
            client-secret: your-google-client-secret
            scope: [openid, email, profile]

jwt:
  secret: your-jwt-secret-key-at-least-32-bytes
  access-token-expiration-ms: 3600000

app:
  frontend-url: http://localhost:5173
