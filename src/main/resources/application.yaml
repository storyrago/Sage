spring:
  datasource:
    url: jdbc:mysql://localhost:3306/spring_realtimechat_service
    username: root
    password: 1111
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: springboot-realtimechat
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
jwt:
  secret: dsadsadsadsadsadsadsadsadsadsads
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
aws:
  s3:
    bucket: realtimechat-images-storyrago
    region: ap-northeast-2