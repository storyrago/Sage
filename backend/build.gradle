plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
	//Confluent 스키마 레지스트리 클라이언트·Avro 직렬화기는 Maven Central에 없다
	maven {
		url = 'https://packages.confluent.io/maven/'
		content { includeGroup 'io.confluent' }
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	//actuator (배포 기동 검증용 헬스 엔드포인트)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	//OtlpMetricsExportAutoConfiguration이 OpenTelemetryProperties 빈을 요구한다 — 없으면 enabled 값과 무관하게
	//레지스트리 빈 자체가 생성되지 않는다(자동설정 클래스가 아예 조건 불충족으로 스킵됨)
	runtimeOnly 'org.springframework.boot:spring-boot-opentelemetry'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'

	//flyway (DB 마이그레이션) — Boot 4는 autoconfig 모듈(spring-boot-flyway)이 별도라 함께 추가
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	//cross-node 메시지 순서 재현 테스트용 — 실제 Redis 컨테이너로 두 노드의 pub/sub 수신 순서를 관찰한다
	//버전은 Boot 4 BOM이 관리(testcontainers.version=2.0.4, Docker 29 호환)
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testImplementation 'org.testcontainers:testcontainers-kafka'

	//swagger 문서화
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

	//spring security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-messaging'

	//oauth2 client (Google 로그인)
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	//valid
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	//jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	//web-socket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	//redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	//메시지 이벤트 Avro 직렬화(스키마 레지스트리 와이어 포맷). 8.1.x는 Boot BOM의 kafka-clients 4.1과 같은 계열
	implementation 'io.confluent:kafka-avro-serializer:8.1.6'

	//aws s3
	implementation 'software.amazon.awssdk:s3:2.31.0'
}

tasks.named('test') {
	useJUnitPlatform()
	//측정용 테스트(CrossNodeMessageOrderTest) opt-in 스위치를 JVM 시스템 프로퍼티로 전달한다.
	//-Dmeasure=true로 테스트 프로세스는 포크되므로 명시적으로 중계해야 한다.
	systemProperty 'measure', System.getProperty('measure', 'false')
}

tasks.named('jar'){
	enabled = false
}
