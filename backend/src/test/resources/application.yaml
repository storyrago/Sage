spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
  kafka:
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: latest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
    listener:
      concurrency: 3
      observation-enabled: true
      # 일반 테스트는 브로커 없이 배선만 본다. 소비자 컨테이너를 띄우지 않는다.
      # 실제 소비는 cdc 태그 테스트가 컨테이너 위에서 본다(그쪽은 KafkaTestNodes가 실제 앱을 띄운다).
      auto-startup: false
    admin:
      # 기동 시 토픽 생성을 위해 브로커에 접속하지 않는다. cdc 테스트는 CdcTestEnvironment가 토픽을 미리 만든다.
      auto-create: false
  flyway:
    # 테스트는 H2 create-drop로 스키마 생성, Flyway 미개입.
    # 마이그레이션 SQL과 ddl-auto: validate는 CI의 "마이그레이션·스키마 검증" 스텝에서
    # 실제 MySQL로 기동해 확인한다(.github/workflows/ci.yml).
    enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - openid
              - email
              - profile

jwt:
  secret: test-secret-key-for-jwt-authentication-1234567890
  access-token-expiration-ms: 3600000

aws:
  s3:
    bucket: test-bucket
    region: ap-northeast-2

app:
  frontend-url: http://localhost:5173
  message:
    delivery: kafka
  outbox:
    enabled: true
    # DefaultSchemaRegistryInitializer가 기동 전에 스키마를 등록해 두는 모의 레지스트리.
    schema-registry-url: mock://sage-test
