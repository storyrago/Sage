spring:
  datasource:
    url: jdbc:mysql://localhost:3306/spring_realtimechat_service
    username: root
    password: 1111
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: springboot-realtimechat
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    baseline-on-migrate: true   # 기존 스키마 DB는 baseline으로 편입(재실행 안 함)
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
      # Redis 응답 없음(TCP는 연결되나 무응답) 상황에서 Lettuce 기본 타임아웃(60초)이 그대로 걸리는 것을 막는다.
      # 정상 응답은 2~3ms이므로 500ms는 100배 이상의 여유. 미설정 시 요청마다 워커 스레드가 60초 점유된다.
      connect-timeout: 500ms
      timeout: 500ms
  kafka:
    # 소비자는 app.message.delivery=kafka일 때만 만들어진다. redis 경로에서는 Kafka에 접속하지 않는다.
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 값은 바이트로 받고 소비자가 Avro로 읽는다. 처리하지 못한 이벤트를 원본 바이트 그대로 DLT에 남기기 위해서다.
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      # 서버별 group은 기동할 때 새로 생긴다. 지난 이벤트를 되감아 보내지 않는다(재연결한 클라이언트는 REST로 다시 읽는다).
      auto-offset-reset: latest
      enable-auto-commit: false
    producer:
      # DLT 발행용. 원본 바이트를 그대로 싣는다.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
    listener:
      # 토픽 파티션 6개를 소비자 스레드 3개가 나눠 읽는다. 한 파티션은 한 스레드가 순서대로 처리한다.
      concurrency: 3
      observation-enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope:
              - openid
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy-client-secret}
            client-name: Kakao
            # redirect-uri 기본 템플릿은 CommonOAuth2Provider(google 등)에만 적용된다. 카카오는 커스텀 provider라 명시가 필요하다
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            # account_email은 비즈니스 인증을 받은 앱에만 열리는 동의항목이라 요청하지 않는다.
            # 카카오 회원은 email 없이 생성되며, 신원은 (provider, provider_id)로 유지된다
            scope:
              - openid
              - profile_nickname
              - profile_image
        provider:
          kakao:
            # issuer-uri는 부팅 시 discovery를 네트워크로 가져와 CI/테스트 컨텍스트 로드를 막는다. 엔드포인트를 명시한다
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            # OIDC 표준 UserInfo. /v2/user/me는 카카오 REST API 응답 형식이라 sub 클레임이 없다
            user-info-uri: https://kapi.kakao.com/v1/oidc/userinfo
            jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
            user-name-attribute: sub
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
aws:
  s3:
    bucket: realtimechat-images-storyrago
    region: ap-northeast-2
server:
  forward-headers-strategy: framework   # nginx(X-Forwarded-*) 뒤에서 OAuth redirect_uri를 https 원본 host로 생성
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}   # OAuth 성공 후 JWT 핸드오프 대상
  message:
    # 메시지 전파 경로. redis(기본): 저장 후 Redis Pub/Sub으로 방송. kafka: 커밋된 outbox 이벤트를 Kafka 소비자가 전달.
    # kafka는 app.outbox.enabled=true가 필요하다(아니면 기동 실패).
    delivery: ${APP_MESSAGE_DELIVERY:redis}
    # 서버마다 다른 값. 비우면 기동마다 새로 만든다. 소비자 group 이름(sage-realtime-<id>, sage-unread-<id>)에 쓰인다.
    node-id: ${APP_MESSAGE_NODE_ID:}
  outbox:
    # 메시지 이벤트를 outbox(→ Debezium → Kafka)에 남길지. 기본은 끔 — 기존 Redis 전파만 동작한다.
    # 켜려면 스키마 레지스트리에 스키마가 등록돼 있어야 한다(infra/local/README.md).
    enabled: ${APP_OUTBOX_ENABLED:false}
    schema-registry-url: ${APP_OUTBOX_SCHEMA_REGISTRY_URL:http://localhost:8081}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      group:
        readiness:
          # 배포 게이트(컨테이너 healthcheck)에서 Redis만 제외한다. Redis는 fail-open으로 설계돼
          # 있어 죽어도 API는 계속 응답하고(실시간 배달·프레즌스만 죽는다), 그걸로 배포를 막으면
          # 정작 그 문제를 고치는 배포조차 나가지 못한다. db·diskSpace는 게이트에 남긴다.
          include: readinessState, db, diskSpace
