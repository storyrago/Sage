spring:
  datasource:
    url: jdbc:mysql://localhost:3306/spring_realtimechat_service
    username: root
    password: 1111
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: springboot-realtimechat
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
    baseline-on-migrate: true   # 기존 스키마 DB는 baseline으로 편입(재실행 안 함)
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
      # Redis 응답 없음(TCP는 연결되나 무응답) 상황에서 Lettuce 기본 타임아웃(60초)이 그대로 걸리는 것을 막는다.
      # 정상 응답은 2~3ms이므로 500ms는 100배 이상의 여유. 미설정 시 요청마다 워커 스레드가 60초 점유된다.
      connect-timeout: 500ms
      timeout: 500ms
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope:
              - openid
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy-client-secret}
            client-name: Kakao
            # redirect-uri 기본 템플릿은 CommonOAuth2Provider(google 등)에만 적용된다. 카카오는 커스텀 provider라 명시가 필요하다
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            # account_email은 비즈니스 인증을 받은 앱에만 열리는 동의항목이라 요청하지 않는다.
            # 카카오 회원은 email 없이 생성되며, 신원은 (provider, provider_id)로 유지된다
            scope:
              - openid
              - profile_nickname
              - profile_image
        provider:
          kakao:
            # issuer-uri는 부팅 시 discovery를 네트워크로 가져와 CI/테스트 컨텍스트 로드를 막는다. 엔드포인트를 명시한다
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            # OIDC 표준 UserInfo. /v2/user/me는 카카오 REST API 응답 형식이라 sub 클레임이 없다
            user-info-uri: https://kapi.kakao.com/v1/oidc/userinfo
            jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
            user-name-attribute: sub
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
aws:
  s3:
    bucket: realtimechat-images-storyrago
    region: ap-northeast-2
server:
  forward-headers-strategy: framework   # nginx(X-Forwarded-*) 뒤에서 OAuth redirect_uri를 https 원본 host로 생성
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}   # OAuth 성공 후 JWT 핸드오프 대상
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      group:
        readiness:
          # 배포 게이트(컨테이너 healthcheck)에서 Redis만 제외한다. Redis는 fail-open으로 설계돼
          # 있어 죽어도 API는 계속 응답하고(실시간 배달·프레즌스만 죽는다), 그걸로 배포를 막으면
          # 정작 그 문제를 고치는 배포조차 나가지 못한다. db·diskSpace는 게이트에 남긴다.
          include: readinessState, db, diskSpace
