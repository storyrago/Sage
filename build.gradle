plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	//actuator (배포 기동 검증용 헬스 엔드포인트)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	//otlp 메트릭 레지스트리 (actuator가 이미 수집한 메트릭을 OTLP로 내보냄, 버전은 micrometer BOM이 관리)
	runtimeOnly 'io.micrometer:micrometer-registry-otlp'
	//OtlpMetricsExportAutoConfiguration이 OpenTelemetryProperties 빈을 요구한다 — 없으면 enabled 값과 무관하게
	//레지스트리 빈 자체가 생성되지 않는다(자동설정 클래스가 아예 조건 불충족으로 스킵됨)
	runtimeOnly 'org.springframework.boot:spring-boot-opentelemetry'
	//prometheus 레지스트리 (로컬 관측 스택이 /actuator/prometheus로 긁어감). 같은 수집 결과를
	//push(OTLP)와 pull(Prometheus) 두 방향으로 내보내는 것뿐이라 둘은 공존한다
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'

	//flyway (DB 마이그레이션) — Boot 4는 autoconfig 모듈(spring-boot-flyway)이 별도라 함께 추가
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	//OTLP 익스포트가 꺼져 있는지 빈 타입으로 직접 검증하기 위한 테스트 전용 컴파일 의존성
	testCompileOnly 'io.micrometer:micrometer-registry-otlp'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	//swagger 문서화
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

	//spring security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-messaging'

	//oauth2 client (Google 로그인)
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	//valid
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	//jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	//web-socket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	//redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	//aws s3
	implementation 'software.amazon.awssdk:s3:2.31.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('jar'){
	enabled = false
}
